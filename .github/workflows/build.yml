name: CI & Build APK - NexusMIDI Pro

on:
  pull_request:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  workflow_dispatch: # Permite rodar manualmente clicando em um botão

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Qualidade: tipos, lint, testes e build web. Roda em PRs e em todo push.
  # ---------------------------------------------------------------------------
  check:
    name: Typecheck, Lint, Testes e Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache do npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Instalar dependências
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build web (PWA)
        run: npm run build

  # ---------------------------------------------------------------------------
  # Android: gera o APK debug a cada push; em tags `v*` gera release assinado (se houver segredos)
  # e publica no GitHub Releases.
  # ---------------------------------------------------------------------------
  android:
    name: Build Android
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # necessário para criar o Release
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache do npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Instalar dependências
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Definir versão do app
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=$(node -p "require('./package.json').version")-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Build web (bundle do APK) e sincronizar com o Android
        run: |
          npm run build:android
          npx cap sync android

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK de Debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Salvar APK de Debug
        uses: actions/upload-artifact@v7
        with:
          name: NexusMIDI-Pro-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # ---- Release (somente em tags v*) ----
      - name: Preparar assinatura do release
        id: signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Segredo ANDROID_KEYSTORE_BASE64 ausente: o Release levará apenas o APK de debug."
          fi

      - name: Compilar APK e AAB de Release (assinados)
        if: steps.signing.outputs.signed == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Publicar GitHub Release (assinado)
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab

      - name: Publicar GitHub Release (somente debug)
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.signed != 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
