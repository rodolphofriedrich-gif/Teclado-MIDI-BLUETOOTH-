name: Build APK do Teclado MIDI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # Permite clicar para rodar manualmente

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Dar permissão ao Gradle
        run: chmod +x ./gradlew

      - name: Gerar APK (versão de teste)
        run: ./gradlew assembleDebug

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Teclado-MIDI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
